name: Bug report
description: Report a problem with the Riftor CLI or assessment workflow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include the Riftor version or commit and your Node.js version when available.
        Do not include API keys, authorization documents, or private assessment data.
  - type: input
    id: version
    attributes:
      label: Riftor version or commit
      placeholder: 5.0.0-dev.0 or a commit SHA
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.19.0
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      placeholder: Ubuntu 24.04 / bash
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. run `riftor`
        2. type ...
        3. ...
  - type: input
    id: model
    attributes:
      label: Provider and model (if relevant)
      placeholder: provider/model
  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      render: shell
  - type: checkboxes
    id: authorized
    attributes:
      label: Confirmation
      options:
        - label: This report does not involve testing systems I am not authorized to assess.
          required: true
