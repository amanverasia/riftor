name: Feature request
description: Suggest an improvement to the Riftor CLI or assessment workflow
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that riftor makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like riftor to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / agent workflow
        - Authorization / scope
        - Assessment adapters
        - Findings / evidence / reports
        - Installation / documentation
        - Other
